version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      vite-laravel-toolchain:
        patterns:
          - "vite"
          - "laravel-vite-plugin"
      tailwind-toolchain:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/vite"
      postcss-toolchain:
        patterns:
          - "postcss"
          - "autoprefixer"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      laravel-runtime:
        patterns:
          - "laravel/framework"
          - "laravel/sanctum"
          - "laravel/tinker"
        update-types:
          - "minor"
          - "patch"
      phpunit-test-runner:
        patterns:
          - "phpunit/phpunit"
          - "nunomaduro/collision"
        update-types:
          - "minor"
          - "patch"
